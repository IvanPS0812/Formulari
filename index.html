<!DOCTYPE html>
<html lang="ca">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <main>
        <h1>Formulari de registre</h1>
        <p class="Introducció">Omple el formulari per registrar-te a l'activitat</p>
        <form action="https://m0373ac3.free.nf/processa.php" method="get">
            <fieldset>
                <legend>Dades personals</legend>
                <label for="nom">Nom:</label>
                <input type="text" id="nom" name="nom" required>
                <label for="cognom">cognom:</label>
                <input type="text" id="cognom" name="cognom">
                <label for="correu">Correu electrònic:</label>
                <input type="email" id="correu" name="correu">
                <label for="contrasenya">contrasenya:</label>
                <input type="password" id="contrasenya" name="contrasenya">
                <label for="edat">Edat:</label>
                <input type="number" id="edat" name="edat" min="14" max="100">
                <label for="data">Data de naixement</label>
                <input type="date" id="data" name="data">
                <label for="telefon">telèfon</label>
                <input type="tel" id="telefon" name="telefon">
                <label for="web">Pàgina web</label>
                <input type="url" id="web" name="web" placeholder="https://exemple.com">
            </fieldset>
            <fieldset>
                <legend>Preferencies</legend>
                <label for="color">Color preferit:</label>
                <input type="color" id="color" name="color" value="#0d6efd">
                <legend for="puntuacio">Quant t'agrada programar?</legend>
                <input type="range" min="0" max="10" value="5" id="puntuacio" name="puntuacio">
                <label>Quin es el teu genere?</label>
                <input type="radio" id="home" name="genere" value="home">
                <label for="home">Home</label>
                <input type="radio" id="dona" name="genere" value="dona">
                <label for="dona">Dona</label>
                <input type="radio" id="altre" name="genere" value="altre">
                <label for="no">No ho vull dir</label>
                <input type="radio" id="no" name="genere" value="no">
                <label for="altre">Altre</label>
                <label>Quines son les teves aficions?</label>
                <input type="checkbox" id="programacio" name="aficions" value="programacio">
                <label for="programacio">Programació</label>
                <input type="checkbox" id="videojocs" name="aficions" value="videojocs">
                <label for="videojocs"> Videojocs</label>
                <input type="checkbox" id="esport" name="aficions" value="esport">
                <label for="esport">Esport</label>
                <input type="checkbox" id="musica" name="aficions" value="musica">
                <label for="musica">Música</label>
                <input type="checkbox" id="cinema" name="aficions" value="cinema">
                <label for="cinema">Cinema</label>
                <label for="mes">Quan vols començar l'activitat?</label>
                <input type="month" id="mes" name="mes">
                <label for="hora">quin horari et va millor?</label>
                <input type="time" id="hora" name="hora">
            </fieldset>
            <fieldset>
                <legend>Localització</legend>
                <label for="pais">País:</label>
                <select id="pais" name="pais">
                    <option value="espanya">Espanya</option>
                    <option value="franca">França</option>
                    <option value="italia">Itàlia</option>
                    <option value="portugal">Portugal</option>
                    <option value="alemanya">Alemanya</option>
                    <option value="regne_unit">Regne Unit</option>
                    <option value="rumania">Rumania</option>
                </select>
                <label for="municipi">Municipi</label>
                <input type="text" id="municipi" name="municipi" list="municipis">
                <datalist id="municipis">
                    <option value="Barcelona">
                    <option value="Girona">
                    <option value="Lleida">
                    <option value="Tarragona">
                    <option value="Badalona">
                    <option value="Sabadell">
                    <option value="Terrassa">
                    <option value="Mataró">
                    <option value="Granollers">
                    <option value="Madrid">
                </datalist>

            </fieldset>
            <fieldset>
                <legend>Informació addicional</legend>
                <label for="comentaris">Comentaris:</label>
                <textarea id="comentaris" name="comentaris"></textarea>
                <label for="fitxer">Fitxer</label>
                <input type="file" id="fitxer" name="fitxer">
                 <label for="condicions">Accepto les condicions de la inscripció</label>
                <input type="checkbox" id="condicions" name="condicions">
            </fieldset>

            <input type="submit" value="Enviar">
            <input type="reset" value="Netejar">
        </form>
    </main>
</body>

</html>
